name: Crash / Miscompilation Evidence Package
about: Report crashes, timeouts, wrong-code, or miscompilations with reproducible evidence.
title: "bug: <short summary>"
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please provide a reproducible evidence package.
        Reports missing required fields are hard to triage and may be sent back for completion.
        See docs/crash_triage_runbook.md for the triage SLO, labels, and bucket format.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong and why it is unexpected?
      placeholder: "Program returns 0 instead of 42 at O2 on x86_64"
    validations:
      required: true

  - type: dropdown
    id: failure_kind
    attributes:
      label: Failure kind
      options:
        - crash
        - timeout
        - panic
        - wrong-code
        - miscompilation
    validations:
      required: true

  - type: input
    id: bucket_signature
    attributes:
      label: Bucket signature
      description: Use the runbook format, or write "not assigned yet".
      placeholder: "llvm-ir-parser:panic:thread 'main' panicked at ...:abcd1234ef56"
    validations:
      required: true

  - type: input
    id: ci_run
    attributes:
      label: CI run or artifact URL
      description: Link to the failing GitHub Actions run/artifact if this came from CI.
      placeholder: "https://github.com/org/repo/actions/runs/..."
    validations:
      required: false

  - type: textarea
    id: repro_ir
    attributes:
      label: Minimized LLVM IR reproducer (.ll)
      description: Paste minimized IR or link to attached file.
      render: llvm
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Reproduction command transcript
      description: Exact commands used to reproduce.
      placeholder: |
        cargo run -p llvm --bin llvm-ir-min -- --input bug.ll --predicate './repro.sh {{input}}'
        ./repro.sh minimized.ll
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: Target/backend/triple
      placeholder: "x86_64-unknown-linux-gnu, x86 backend"
    validations:
      required: true

  - type: input
    id: opts
    attributes:
      label: Optimization level and flags
      placeholder: "-O2, --features avx2"
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs actual behavior
      placeholder: |
        Expected: exit code 42
        Actual: exit code 0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment/toolchain
      description: Host OS, rustc/cargo versions, LLVM/clang versions.
      placeholder: |
        macOS 15 arm64
        rustc 1.84.0
        LLVM 19.1.7
    validations:
      required: true

  - type: textarea
    id: artifacts
    attributes:
      label: Evidence package artifacts
      description: Attach object/disassembly/hash/log bundle paths or links.
      placeholder: |
        - original.ll
        - minimized.ll
        - ours.o / oracle.o
        - ours.objdump.txt / oracle.objdump.txt
        - hashes.json
        - reducer.log
        - bucket-signature.txt
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Triage checklist
      options:
        - label: I verified the reproducer still fails on current main.
          required: true
        - label: I included commands another developer can run as-is.
          required: true
        - label: I attached or pasted a minimized reproducer.
          required: true
        - label: I included the reducer command/log or explained why reduction was not applicable.
          required: true
