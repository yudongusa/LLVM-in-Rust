name: Release Candidate Protocol

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  protocol:
    name: RC checklist and rollback playbook
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate RC protocol documentation
        run: scripts/release_candidate_protocol.sh
