name: Update Golden Codegen Baseline

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or ref to update"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  update:
    name: Regenerate and commit golden baseline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust stable toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup default stable

      - name: Regenerate golden baseline
        run: scripts/update_golden_codegen.sh --bless

      - name: Commit baseline if changed
        run: |
          if git diff --quiet -- src/llvm-codegen/tests/golden/codegen_x86_64_elf.json Cargo.lock; then
            echo "Golden baseline already up to date."
            exit 0
          fi
          git config user.name "nightowl-bot"
          git config user.email "nightowlcraw@gmail.com"
          git add src/llvm-codegen/tests/golden/codegen_x86_64_elf.json Cargo.lock
          git commit -m "Update golden codegen baseline for issue #178"
          git push origin HEAD:${{ inputs.ref }}
