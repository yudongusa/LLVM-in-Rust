name: Production Operations Docs

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  docs:
    name: Operator and triage runbooks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate production operations docs
        run: scripts/production_ops_docs.sh
