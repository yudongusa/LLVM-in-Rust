name: Sanitizer and UB hardening

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
  push:
    tags:
      - "v*"
      - "rc-*"

jobs:
  asan_core:
    name: ASan core smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        run: |
          rustup set profile minimal
          rustup toolchain install nightly --component rust-src

      - name: Run ASan core lane
        run: scripts/sanitizer_matrix.sh asan-core

  miri_ub_core:
    name: Miri UB core smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly + Miri
        run: |
          rustup set profile minimal
          rustup toolchain install nightly --component miri --component rust-src

      - name: Run Miri UB lane
        run: scripts/sanitizer_matrix.sh miri-core

  tsan_core:
    name: TSan core nightly lane
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        run: |
          rustup set profile minimal
          rustup toolchain install nightly --component rust-src

      - name: Run TSan core lane
        run: scripts/sanitizer_matrix.sh tsan-core
