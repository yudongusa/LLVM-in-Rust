name: LLVM Test Suite IR Compatibility

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Limit number of .ll files scanned; 0 means all files"
        required: false
        default: "0"
  schedule:
    - cron: "17 6 * * 1"

jobs:
  llvm_test_suite_compat:
    name: LLVM test-suite compatibility report
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust stable toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup default stable

      - name: Install clang for source-to-IR fallback
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-llvm-test-suite-compat-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-llvm-test-suite-compat-
            ${{ runner.os }}-cargo-

      - name: Run LLVM test-suite IR compatibility scan
        id: compat
        continue-on-error: true
        env:
          LLVM_COMPAT_LIMIT: ${{ inputs.limit || '0' }}
        run: ./scripts/llvm_test_suite_compat.sh

      - name: Publish compatibility summary
        if: always()
        run: |
          report="target/llvm-test-suite-compat/report/report.md"
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# LLVM Test Suite IR Compatibility Report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No report was produced. Check the workflow log for setup failures." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${{ steps.compat.outcome }}" != "success" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Compatibility scan failed in informational mode; this job stays green so gaps can be tracked without blocking unrelated work." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llvm-test-suite-compat-report
          path: target/llvm-test-suite-compat/report/
          if-no-files-found: warn
