name: Golden Codegen Gate

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

jobs:
  golden_codegen:
    name: Locked golden object checksums
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust stable toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup default stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-golden-codegen-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-golden-codegen-
            ${{ runner.os }}-cargo-

      - name: Check deterministic golden codegen corpus
        env:
          LLVM_IN_RUST_DETERMINISTIC: "1"
        run: cargo +stable test -p llvm-in-rust-codegen golden -- --nocapture

  baseline_update_approval:
    name: Golden baseline update approval
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: Require maintainer label for baseline updates
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const touchedBaseline = files.some((file) =>
              file.filename === 'src/llvm-codegen/tests/golden/codegen_x86_64_elf.json'
            );
            if (!touchedBaseline) return;

            const labels = context.payload.pull_request.labels.map((label) => label.name);
            if (!labels.includes('approved-golden-update')) {
              core.setFailed(
                'Golden baseline changed. A maintainer must add the `approved-golden-update` label after reviewing the intentional drift.'
              );
            }
