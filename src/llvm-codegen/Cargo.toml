[package]
name = "llvm-codegen"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

description = "Machine-independent code generation infrastructure for LLVM-in-Rust."
repository = "https://github.com/yudongusa/LLVM-in-Rust"
homepage = "https://github.com/yudongusa/LLVM-in-Rust"
keywords = ["llvm", "compiler", "ir", "codegen", "rust"]
categories = ["compilers", "development-tools"]
[dependencies]
llvm-ir = { version = "0.1.0", path = "../llvm-ir" }
llvm-analysis = { version = "0.1.0", path = "../llvm-analysis" }

[dev-dependencies]
llvm-ir-parser = { path = "../llvm-ir-parser" }
llvm-transforms = { path = "../llvm-transforms" }
llvm-target-x86 = { path = "../llvm-target-x86" }
llvm-target-arm = { path = "../llvm-target-arm" }
serde_json = "1"
